<svg width="1000" height="350" viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech stack" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A14"/><stop offset="1" stop-color="#0B1426"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#93C5FD" stop-opacity=".3"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="clip"><rect width="1000" height="350" rx="24"/></clipPath>
  </defs>

  <rect width="1000" height="350" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#clip)"><g filter="url(#blur)">
    <circle cx="880" cy="80" r="110" fill="#7C3AED" opacity=".3"/>
    <circle cx="100" cy="300" r="100" fill="#2563EB" opacity=".45"/>
  </g></g>

  <rect x="30" y="24" width="940" height="302" rx="26" fill="url(#glass)" stroke="url(#stroke)" stroke-width="1.5"/>

  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="62" font-size="13" font-weight="700" letter-spacing="4" fill="#93C5FD">TECH STACK</text>

    <text x="50" y="100" font-size="11" font-weight="700" letter-spacing="3" fill="#60A5FA">FRONTEND</text>
    <g fill="url(#glass)" stroke="url(#stroke)">
      <rect x="50" y="112" width="60" height="34" rx="17"/><rect x="120" y="112" width="52" height="34" rx="17"/><rect x="182" y="112" width="105" height="34" rx="17"/><rect x="297" y="112" width="105" height="34" rx="17"/><rect x="412" y="112" width="68" height="34" rx="17"/><rect x="490" y="112" width="82" height="34" rx="17"/><rect x="582" y="112" width="75" height="34" rx="17"/><rect x="667" y="112" width="120" height="34" rx="17"/><rect x="797" y="112" width="98" height="34" rx="17"/>
    </g>
    <g font-size="13" font-weight="500" fill="#E2E8F0" text-anchor="middle">
      <text x="80" y="134">HTML</text><text x="146" y="134">CSS</text><text x="234" y="134">JavaScript</text><text x="350" y="134">TypeScript</text><text x="446" y="134">React</text><text x="531" y="134">Next.js</text><text x="620" y="134">Vue.js</text><text x="727" y="134">Tailwind CSS</text><text x="846" y="134">Bootstrap</text>
    </g>

    <text x="50" y="178" font-size="11" font-weight="700" letter-spacing="3" fill="#60A5FA">BACKEND &amp; DATABASE</text>
    <g fill="url(#glass)" stroke="url(#stroke)">
      <rect x="50" y="190" width="52" height="34" rx="17"/><rect x="112" y="190" width="82" height="34" rx="17"/><rect x="204" y="190" width="82" height="34" rx="17"/><rect x="296" y="190" width="68" height="34" rx="17"/><rect x="374" y="190" width="105" height="34" rx="17"/>
    </g>
    <g font-size="13" font-weight="500" fill="#E2E8F0" text-anchor="middle">
      <text x="76" y="212">PHP</text><text x="153" y="212">Laravel</text><text x="245" y="212">Node.js</text><text x="330" y="212">MySQL</text><text x="427" y="212">PostgreSQL</text>
    </g>

    <text x="50" y="256" font-size="11" font-weight="700" letter-spacing="3" fill="#60A5FA">TOOLS</text>
    <g fill="url(#glass)" stroke="url(#stroke)">
      <rect x="50" y="268" width="52" height="34" rx="17"/><rect x="112" y="268" width="75" height="34" rx="17"/>
    </g>
    <g font-size="13" font-weight="500" fill="#E2E8F0" text-anchor="middle">
      <text x="76" y="290">Git</text><text x="150" y="290">GitHub</text>
    </g>
