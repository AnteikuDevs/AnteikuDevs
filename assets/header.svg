<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Teguh Sugiarto - Fullstack Developer and IT Professional" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A14"/><stop offset="1" stop-color="#0B1426"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#93C5FD" stop-opacity=".3"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#93C5FD"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60A5FA" stop-opacity="0"/><stop offset=".5" stop-color="#60A5FA" stop-opacity=".9"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="clip"><rect width="1000" height="320" rx="24"/></clipPath>
  </defs>

  <rect width="1000" height="320" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <g filter="url(#blur)">
      <circle cx="170" cy="90" r="110" fill="#2563EB" opacity=".6"><animate attributeName="cx" values="170;260;170" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="250" r="120" fill="#7C3AED" opacity=".38"><animate attributeName="cy" values="250;200;250" dur="16s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="50" r="80" fill="#06B6D4" opacity=".32"><animate attributeName="cx" values="620;540;620" dur="12s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <rect x="50" y="30" width="900" height="260" rx="28" fill="url(#glass)" stroke="url(#stroke)" stroke-width="1.5"/>
  <rect x="80" y="31" width="840" height="1.5" rx="1" fill="#fff" opacity=".35"/>

  <text x="500" y="115" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="5" fill="url(#accent)">TEGUH SUGIARTO</text>
  <text x="500" y="153" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="5" fill="#93C5FD">FULLSTACK DEVELOPER  ·  IT PROFESSIONAL</text>
  <rect x="350" y="175" width="300" height="1.5" fill="url(#line)"/>
  <text x="500" y="207" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#CBD5E1">Building scalable web applications with clean, maintainable code.</text>

  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#E2E8F0" text-anchor="middle">
    <rect x="258" y="235" width="100" height="28" rx="14" fill="url(#glass)" stroke="url(#stroke)"/><text x="308" y="253">6+ YEARS</text>
    <rect x="370" y="235" width="110" height="28" rx="14" fill="url(#glass)" stroke="url(#stroke)"/><text x="425" y="253">FULLSTACK</text>
    <rect x="492" y="235" width="250" height="28" rx="14" fill="url(#glass)" stroke="url(#stroke)"/><text x="617" y="253">IT STAFF · ITB WIDYA GAMA</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
