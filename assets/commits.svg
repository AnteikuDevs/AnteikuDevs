<svg width="1000" height="350" viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering standards: commit convention" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A14"/><stop offset="1" stop-color="#0B1426"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#93C5FD" stop-opacity=".3"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="clip"><rect width="1000" height="350" rx="24"/></clipPath>
  </defs>

  <rect width="1000" height="350" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#clip)"><g filter="url(#blur)">
    <circle cx="860" cy="80" r="110" fill="#06B6D4" opacity=".25"/>
    <circle cx="140" cy="300" r="100" fill="#2563EB" opacity=".42"/>
  </g></g>

  <rect x="30" y="24" width="940" height="302" rx="26" fill="url(#glass)" stroke="url(#stroke)" stroke-width="1.5"/>

  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="70" y="62" font-size="13" font-weight="700" letter-spacing="4" fill="#93C5FD">ENGINEERING STANDARDS · COMMIT CONVENTION</text>

    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" font-weight="700" fill="#67E8F9" text-anchor="middle">
      <rect x="70" y="88" width="80" height="32" rx="16" fill="url(#glass)" stroke="url(#stroke)"/><text x="110" y="109">feat</text>
      <rect x="70" y="134" width="80" height="32" rx="16" fill="url(#glass)" stroke="url(#stroke)"/><text x="110" y="155">fix</text>
      <rect x="70" y="180" width="80" height="32" rx="16" fill="url(#glass)" stroke="url(#stroke)"/><text x="110" y="201">perf</text>
      <rect x="70" y="226" width="80" height="32" rx="16" fill="url(#glass)" stroke="url(#stroke)"/><text x="110" y="247">style</text>
      <rect x="70" y="272" width="80" height="32" rx="16" fill="url(#glass)" stroke="url(#stroke)"/><text x="110" y="293">docs</text>
    </g>

    <g font-size="15" font-weight="600" fill="#F1F5F9">
      <text x="180" y="109">New feature</text>
      <text x="180" y="155">Bug fix</text>
      <text x="180" y="201">Performance improvement</text>
      <text x="180" y="247">UI &amp; formatting changes</text>
      <text x="180" y="293">Documentation</text>
    </g>

    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" fill="#94A3B8">
      <text x="480" y="109">feat: add authentication module</text>
      <text x="480" y="155">fix: resolve mobile viewport overflow</text>
      <text x="480" y="201">perf: implement lazy loading</text>
      <text x="480" y="247">style: refine dashboard layout</text>
      <text x="480" y="293">docs: update API integration guide</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
