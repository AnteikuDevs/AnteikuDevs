<svg width="1000" height="310" viewBox="0 0 1000 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Teguh Sugiarto" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A14"/><stop offset="1" stop-color="#0B1426"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#93C5FD" stop-opacity=".3"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#93C5FD"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="clip"><rect width="1000" height="310" rx="24"/></clipPath>
  </defs>

  <rect width="1000" height="310" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#clip)"><g filter="url(#blur)">
    <circle cx="120" cy="260" r="100" fill="#2563EB" opacity=".45"/>
    <circle cx="900" cy="60" r="100" fill="#06B6D4" opacity=".28"/>
  </g></g>

  <rect x="30" y="24" width="940" height="262" rx="26" fill="url(#glass)" stroke="url(#stroke)" stroke-width="1.5"/>

  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="70" y="62" font-size="13" font-weight="700" letter-spacing="4" fill="#93C5FD">ABOUT</text>
    <g font-size="15" fill="#CBD5E1">
      <text x="70" y="95">Fullstack Developer with 6+ years of experience designing, building, and maintaining web applications.</text>
      <text x="70" y="118">Currently IT Staff at ITB Widya Gama Lumajang, combining software engineering with technology</text>
      <text x="70" y="141">management while pursuing a Bachelor's degree in Informatics.</text>
    </g>

    <g>
      <rect x="70" y="165" width="200" height="96" rx="18" fill="url(#glass)" stroke="url(#stroke)"/>
      <text x="170" y="209" text-anchor="middle" font-size="28" font-weight="800" fill="url(#accent)">6+</text>
      <text x="170" y="236" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="2" fill="#94A3B8">YEARS EXPERIENCE</text>

      <rect x="290" y="165" width="200" height="96" rx="18" fill="url(#glass)" stroke="url(#stroke)"/>
      <text x="390" y="209" text-anchor="middle" font-size="26" font-weight="800" fill="url(#accent)">Fullstack</text>
      <text x="390" y="236" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="2" fill="#94A3B8">SPECIALIZATION</text>

      <rect x="510" y="165" width="200" height="96" rx="18" fill="url(#glass)" stroke="url(#stroke)"/>
      <text x="610" y="209" text-anchor="middle" font-size="26" font-weight="800" fill="url(#accent)">IT Staff</text>
      <text x="610" y="236" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="2" fill="#94A3B8">CURRENT ROLE</text>

      <rect x="730" y="165" width="200" height="96" rx="18" fill="url(#glass)" stroke="url(#stroke)"/>
      <text x="830" y="209" text-anchor="middle" font-size="28" font-weight="800" fill="url(#accent)">S1</text>
      <text x="830" y="236" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="2" fill="#94A3B8">INFORMATIKA · ONGOING</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
