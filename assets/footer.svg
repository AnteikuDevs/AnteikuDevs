<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open to collaboration" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A14"/><stop offset="1" stop-color="#0B1426"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#93C5FD" stop-opacity=".3"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#93C5FD"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="clip"><rect width="1000" height="200" rx="24"/></clipPath>
  </defs>

  <rect width="1000" height="200" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#clip)"><g filter="url(#blur)">
    <circle cx="180" cy="120" r="100" fill="#2563EB" opacity=".5"><animate attributeName="cx" values="180;260;180" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="80" r="100" fill="#7C3AED" opacity=".35"/>
    <circle cx="520" cy="190" r="70" fill="#06B6D4" opacity=".28"/>
  </g></g>

  <rect x="50" y="24" width="900" height="152" rx="26" fill="url(#glass)" stroke="url(#stroke)" stroke-width="1.5"/>
  <rect x="80" y="25" width="840" height="1.5" rx="1" fill="#fff" opacity=".35"/>

  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="500" y="78" font-size="26" font-weight="800" letter-spacing="1" fill="url(#accent)">Open to collaboration</text>
    <text x="500" y="108" font-size="14" fill="#CBD5E1">Project discussions and professional opportunities are always welcome.</text>
    <rect x="340" y="128" width="320" height="30" rx="15" fill="url(#glass)" stroke="url(#stroke)"/>
    <text x="500" y="148" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#93C5FD">teguhsugiarto.webdev@gmail.com</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
